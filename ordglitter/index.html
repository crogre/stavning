<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ordglitter">
<meta name="theme-color" content="#F4F1FF">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ordglitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root,[data-skin="dag"],[data-skin="godis"],[data-skin="hav"],[data-skin="solnedgang"],[data-skin="skog"]{
  color-scheme: light;
  --bg:#F4F1FF; --bg2:#EAF3FF; --surface:#FFFFFF; --surface2:#F3F0FF; --text:#221C45; --muted:#6C6690; --line:#E2DDF5;
  --primary:#7A4DFF; --primary-d:#5A2FD9; --primary-soft:#EDE6FF; --on-primary:#FFFFFF;
  --gold:#FFBE1A; --gold-d:#D99A00;
  --good:#22C07A; --good-d:#17975E; --good-soft:#DDF8EA; --good-ink:#0F7446;
  --bad:#FF4F66; --bad-d:#D63249; --bad-soft:#FFE3E7; --bad-ink:#B3263B;
  --tile:#FFFFFF; --tile-d:#D8D2EE; --ink:#221C45; --hot:#7A4DFF; --hot-line:rgba(122,77,255,.28);
  --m-body:#7A4DFF; --m-belly:#C9B6FF; --locked:#E4E0F2; --locked-d:#C9C3DE;
}
[data-skin="norrsken"]{
  color-scheme: dark;
  --bg:#13153A; --bg2:#1F2360; --surface:#22265E; --surface2:#2A2F6E; --text:#F4F2FF; --muted:#ABA8D8; --line:#363B7A;
  --primary:#39D9B0; --primary-d:#1FA283; --primary-soft:#1E4A5A; --on-primary:#0E2A33;
  --gold:#FFC94A; --gold-d:#C9912A;
  --good:#4FE0AE; --good-d:#28A47C; --good-soft:#173F45; --good-ink:#8BF3CF;
  --bad:#FF6B81; --bad-d:#C94359; --bad-soft:#44203F; --bad-ink:#FFB0BD;
  --tile:#FFF3D6; --tile-d:#D4AE62; --ink:#1B1742; --hot:#FFC94A; --hot-line:rgba(255,201,74,.35);
  --m-body:#39D9B0; --m-belly:#A6F5DE; --locked:#2B2F66; --locked-d:#1C1F4D;
}
[data-skin="godis"]{
  --bg:#FFF0F7; --bg2:#F4EEFF; --surface:#FFFFFF; --surface2:#FFF0F7; --text:#3A1633; --muted:#8E6283; --line:#F6D9E9;
  --primary:#FF3F9A; --primary-d:#D61F76; --primary-soft:#FFE0EF;
  --hot:#E62E88; --hot-line:rgba(255,63,154,.28); --m-body:#FF5FAE; --m-belly:#FFC1E0; --tile-d:#F2C9DD; --locked:#F5E1EC; --locked-d:#E4C3D5;
}
[data-skin="hav"]{
  --bg:#E9F7FF; --bg2:#EFFFFA; --surface:#FFFFFF; --surface2:#EEF8FF; --text:#0F2B3D; --muted:#557487; --line:#D3EAF5;
  --primary:#1195E0; --primary-d:#0A72AE; --primary-soft:#DDF1FF;
  --hot:#0E86CC; --hot-line:rgba(17,149,224,.28); --m-body:#1195E0; --m-belly:#8FD3FA; --tile-d:#C7E3F2; --locked:#DDEBF3; --locked-d:#BDD5E3;
}
[data-skin="solnedgang"]{
  --bg:#FFF3EA; --bg2:#FFE6EE; --surface:#FFFFFF; --surface2:#FFF1E8; --text:#3A1A10; --muted:#8C6152; --line:#F6DCCF;
  --primary:#FF6A3D; --primary-d:#D94B20; --primary-soft:#FFE3D6;
  --hot:#E0521F; --hot-line:rgba(255,106,61,.28); --m-body:#FF6A3D; --m-belly:#FFC9B0; --tile-d:#F2D0BF; --locked:#F6E3DA; --locked-d:#E6CBBE;
}
[data-skin="skog"]{
  --bg:#EEF7EE; --bg2:#F5FAEA; --surface:#FFFFFF; --surface2:#EEF7EF; --text:#14301F; --muted:#587565; --line:#D5E9DB;
  --primary:#2E9E5B; --primary-d:#1F7A43; --primary-soft:#DDF2E4;
  --hot:#1F8A4C; --hot-line:rgba(46,158,91,.28); --m-body:#2E9E5B; --m-belly:#A8E0BC; --tile-d:#CBE3D2; --locked:#E0EDE4; --locked-d:#C5D9CB;
}
[data-skin="midnatt"]{
  color-scheme: dark;
  --bg:#1A1030; --bg2:#2A1450; --surface:#2A1D4A; --surface2:#34245A; --text:#F7F0FF; --muted:#B7A8D8; --line:#43336B;
  --primary:#FF5FD2; --primary-d:#C23AA0; --primary-soft:#4A2352; --on-primary:#2A0A26;
  --gold:#FFC94A; --gold-d:#C9912A;
  --good:#4FE0AE; --good-d:#28A47C; --good-soft:#173F45; --good-ink:#8BF3CF;
  --bad:#FF6B81; --bad-d:#C94359; --bad-soft:#44203F; --bad-ink:#FFB0BD;
  --tile:#FFF3D6; --tile-d:#D4AE62; --ink:#1B1742; --hot:#FF9BE6; --hot-line:rgba(255,155,230,.35);
  --m-body:#FF5FD2; --m-belly:#FFC1F0; --locked:#2E2350; --locked-d:#1F1638;
}
html{background:var(--bg);height:100%}
body{background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;background-color:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100%;overflow-x:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
h1,h2,h3{text-wrap:balance}

.aurora{display:none}
html[data-skin="norrsken"] .aurora{display:block;position:fixed;border-radius:50%;filter:blur(70px);opacity:.3;pointer-events:none;z-index:0}
.aurora.a1{width:70vw;height:30vh;left:-10vw;top:-6vh;background:#39D9B0;animation:drift 22s ease-in-out infinite alternate}
.aurora.a2{width:60vw;height:26vh;right:-12vw;top:6vh;background:#7B6CFF;animation:drift 27s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0) rotate(-5deg)}to{transform:translate(8vw,5vh) rotate(4deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}

/* ---------- shared ---------- */
.bigbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:16px;border:0;cursor:pointer;
  font-family:var(--body);font-weight:900;font-size:1.02rem;letter-spacing:.06em;text-transform:uppercase;
  background:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 var(--primary-d);transition:transform .08s,box-shadow .08s,filter .15s}
.bigbtn:hover:not(:disabled){filter:brightness(1.06)}
.bigbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--primary-d)}
.bigbtn:disabled{background:var(--locked);color:var(--muted);box-shadow:0 4px 0 var(--locked-d);cursor:default}
.bigbtn.good{background:var(--good);box-shadow:0 4px 0 var(--good-d);color:#fff}
.bigbtn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-d);color:#fff}
.bigbtn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#2A1E00}
.bigbtn.ghost{background:var(--surface);color:var(--primary);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.bigbtn svg{width:22px;height:22px}
.textbtn{background:none;border:0;cursor:pointer;color:var(--muted);font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:.9rem;padding:10px}
.textbtn:hover{color:var(--text)}
.kicker{font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
mark.hot{background:none;color:var(--hot);box-shadow:inset 0 -4px 0 var(--hot-line)}
.speak{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:12px;border:0;background:var(--primary);color:var(--on-primary);box-shadow:0 3px 0 var(--primary-d);cursor:pointer}
.speak:active{transform:translateY(3px);box-shadow:none}
.speak svg{width:18px;height:18px}
.shake{animation:shake .45s ease}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.floaty{position:fixed;z-index:95;pointer-events:none;font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--gold);-webkit-text-stroke:1px rgba(0,0,0,.15);text-shadow:0 2px 10px rgba(0,0,0,.25);animation:floatup 1.1s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes floatup{to{transform:translate(-50%,-160%);opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:96;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .25s ease;max-width:calc(100vw - 32px);text-align:center}

/* ---------- mascot ---------- */
.mascot{display:block;overflow:visible}
.mascot .body-g{transform-origin:60px 110px;animation:bob 2.8s ease-in-out infinite}
.mascot .eyes{transform-origin:60px 60px;animation:blink 4.5s infinite}
.mascot .spark{transform-origin:62px 4px;animation:twinkle 1.8s ease-in-out infinite}
.mascot.happy .body-g{animation:hop .6s cubic-bezier(.3,1.6,.5,1) 2}
.mascot.party .body-g{animation:hop .7s cubic-bezier(.3,1.6,.5,1) infinite}
.mascot.sad .body-g{animation:droop .8s ease forwards}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.3) rotate(20deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-16px) scale(1.04,.96)}}
@keyframes droop{to{transform:translateY(4px) scale(1.03,.95)}}
.m-stroke{fill:none;stroke:#1D1640;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- home ---------- */
.app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 60px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px;background:linear-gradient(var(--bg) 75%,transparent)}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .dot{width:12px;height:12px;border-radius:4px;background:var(--primary);transform:rotate(45deg);box-shadow:0 0 0 3px var(--primary-soft)}
.stats-row{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 10px;border-radius:12px;border:2px solid transparent;background:none;font-weight:900;font-size:1rem;font-variant-numeric:tabular-nums;cursor:pointer}
.chip:hover{border-color:var(--line);background:var(--surface)}
.chip svg{width:24px;height:24px}
.chip.flame{color:#FF8A1F} .chip.flame.cold{color:var(--muted)} .chip.flame.cold svg{filter:grayscale(1);opacity:.5}
.chip.gems{color:#1C9BE0}
html[data-dark] .chip.gems{color:#6FD2FF}
.chip.icon{width:40px;justify-content:center;padding:0;color:var(--muted)}

.hero{display:flex;align-items:flex-end;gap:12px;margin-top:6px}
.hero .mascot{width:112px;flex:none}
.bubble{position:relative;flex:1;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:700;font-size:1.02rem;margin-bottom:26px;display:flex;align-items:flex-start;gap:10px}
.bubble::before{content:"";position:absolute;left:-10px;bottom:16px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble > span{flex:1;min-width:0}
.goal{margin-top:6px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal-top b{font-family:var(--display);font-weight:800;font-size:1.1rem}
.goal-top span{color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.meter{height:16px;border-radius:99px;background:var(--locked);overflow:hidden}
.meter i{display:block;height:100%;border-radius:inherit;background:var(--gold);position:relative;transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.meter i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:9px;background:rgba(255,255,255,.4)}

.spacecard{margin-top:14px;position:relative;overflow:hidden;border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;border:0;width:100%;text-align:left;color:#F3F0FF;
  background:radial-gradient(120% 140% at 85% 20%,#3B2C9A 0%,#1A1650 45%,#0B0C24 100%);box-shadow:0 5px 0 #06061A}
.spacecard:active{transform:translateY(5px);box-shadow:none}
.spacecard::before{content:"";position:absolute;inset:0;background:
  radial-gradient(1.5px 1.5px at 12% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 70%,#fffa 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 55% 20%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 80%,#fff9 50%,transparent 51%),
  radial-gradient(1px 1px at 90% 50%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 42% 55%,#fffc 50%,transparent 51%);pointer-events:none}
.spacecard .rk{width:64px;height:64px;flex:none;position:relative;animation:bob 2.2s ease-in-out infinite}
.spacecard b{display:block;font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.15}
.spacecard small{display:block;color:#C9C3FF;font-weight:700;font-size:.92rem;margin-top:2px}
.spacecard .rec{margin-left:auto;text-align:right;flex:none;font-weight:900;font-size:.8rem;color:#FFD66B;letter-spacing:.05em;text-transform:uppercase;position:relative}
.spacecard .rec em{display:block;font-style:normal;font-family:var(--display);font-size:1.5rem;color:#fff;letter-spacing:0}

.unit{margin-top:22px;border-radius:18px;padding:14px 18px;background:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 var(--primary-d)}
.unit .kicker{color:inherit;opacity:.8}
.unit h2{margin:2px 0 0;font-family:var(--display);font-weight:800;font-size:1.3rem}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding:34px 0 26px}
.nwrap{--dx:0px;transform:translateX(var(--dx));display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
@media (max-width:420px){.nwrap{transform:translateX(calc(var(--dx) * .6))}}
.node{position:relative;width:76px;height:70px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:var(--on-primary);
  background:var(--primary);box-shadow:0 7px 0 var(--primary-d);transition:transform .08s,box-shadow .08s}
.node svg{width:34px;height:34px}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--primary-d)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d);color:#5A3B00}
.node.locked{background:var(--locked);box-shadow:0 7px 0 var(--locked-d);color:var(--muted)}
.node.space{background:#241C6E;box-shadow:0 7px 0 #0F0B3A;color:#fff}
.node.space.done{background:linear-gradient(135deg,#FFBE1A,#FF8A1F)}
.node.space.locked{background:var(--locked);box-shadow:0 7px 0 var(--locked-d);color:var(--muted)}
.node.chest{background:none;box-shadow:none;width:84px;height:74px}
.node.chest svg{width:74px;height:66px}
.node.chest.locked svg{filter:grayscale(1);opacity:.55}
.node.current::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid var(--primary-soft);animation:ring 1.6s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.08);opacity:.6}}
.startbub{position:absolute;top:-46px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--surface);border:2px solid var(--line);color:var(--primary);font-weight:900;letter-spacing:.06em;font-size:.85rem;padding:6px 12px;border-radius:12px;animation:float 1.4s ease-in-out infinite;pointer-events:none;z-index:2}
.startbub::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes float{50%{transform:translate(-50%,-5px)}}
.nlabel{font-weight:800;font-size:.9rem;text-align:center;max-width:130px;line-height:1.2}
.crowns{display:flex;gap:2px;height:14px}
.crowns svg{width:14px;height:14px}
.crowns .on{color:var(--gold)} .crowns .off{color:var(--locked-d)}

.section{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.wrow .ww{font-family:var(--display);font-weight:700;font-size:1.3rem;flex:1;letter-spacing:.01em}
.stars{display:inline-flex;gap:2px}
.stars svg{width:16px;height:16px}
.stars .on{color:var(--gold)} .stars .off{color:var(--locked-d)}
.savebox{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.savebox b{display:block;font-family:var(--display);font-weight:800;font-size:1.05rem}
.savebox span{color:var(--muted);font-weight:700;font-size:.92rem}
.diag{margin:4px 0 8px;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.warncard{margin-top:14px;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:18px;background:var(--bad-soft);border:2px solid var(--bad);color:var(--bad-ink);font-weight:700}
.whoload{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:18px;color:var(--muted);font-weight:700;text-align:center}
details.parents{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 16px;color:var(--muted);font-size:.95rem}
details.parents summary{cursor:pointer;font-weight:800;color:var(--text)}
details.parents ul{margin:10px 0;padding-left:18px;display:grid;gap:6px}
.prow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lwrap{flex:1;overflow-y:auto;overflow-x:hidden}
.linner{max-width:640px;margin:0 auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:18px}
.ltop{display:flex;align-items:center;gap:12px}
.xbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:12px}
.xbtn:hover{background:var(--surface)}
.xbtn svg{width:24px;height:24px}
.lbar{flex:1;height:18px;border-radius:99px;background:var(--locked);overflow:hidden}
.lbar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--good);position:relative;transition:width .45s cubic-bezier(.3,1.3,.5,1),background .3s}
.lbar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:5px;border-radius:9px;background:rgba(255,255,255,.4)}
.lbar.fire i{background:linear-gradient(90deg,#FFB020,#FF6A3D)}
.combo{display:inline-flex;align-items:center;gap:3px;font-weight:900;color:#FF7A1A;font-size:.95rem;animation:pop .35s ease;white-space:nowrap}
.combo svg{width:20px;height:20px}
.hearts{display:flex;gap:2px}
.hearts svg{width:24px;height:24px}
.hearts .on{color:var(--bad)} .hearts .off{color:var(--locked-d)}
.ptitle{margin:0;font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.2}
.mrow{display:flex;align-items:flex-end;gap:10px}
.mrow .mascot{width:78px;flex:none}
.mrow .bubble{margin-bottom:14px;font-size:1.08rem}
.blank{display:inline-block;min-width:4.2em;border-bottom:3px solid var(--primary);transform:translateY(-4px)}
.fillw{color:var(--hot);font-weight:900}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);cursor:pointer;text-align:left;transition:transform .08s,border-color .15s,background .15s}
.choice .num{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;border:2px solid var(--line);font-weight:900;font-size:.85rem;color:var(--muted)}
.choice .cw{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,5vw,1.6rem);letter-spacing:.02em;overflow-wrap:anywhere}
.choice:hover:not(:disabled){background:var(--surface2)}
.choice:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.choice.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.choice.sel .num{border-color:var(--primary);color:var(--primary)}
.choice.good{border-color:var(--good);background:var(--good-soft);color:var(--good-ink)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.choice:disabled{cursor:default}

.wordcard,.flashcard{align-self:center;min-width:min(100%,320px);max-width:100%;padding:26px 28px;border-radius:22px;background:var(--tile);color:var(--ink);border:2px solid var(--tile-d);box-shadow:0 6px 0 var(--tile-d);
  text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,3rem);letter-spacing:.03em;line-height:1.1;overflow-wrap:anywhere;animation:pop .45s ease}
html[data-dark] .wordcard mark.hot, html[data-dark] .flashcard mark.hot{color:#6A45E0;box-shadow:inset 0 -4px 0 rgba(106,69,224,.3)}
.flashcard s{text-decoration-color:var(--bad);text-decoration-thickness:4px}
.tipcard{margin:0;display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--surface2);border:2px dashed var(--line);font-weight:700}
.tipcard svg{width:22px;height:22px;flex:none;color:var(--gold-d)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.gapword{align-self:center;font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,3rem);letter-spacing:.04em;display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:2px}
.gapbox{display:inline-grid;place-items:center;min-width:1.4em;height:1.3em;padding:0 .15em;border-radius:12px;border:3px dashed var(--primary);color:var(--primary);background:var(--primary-soft)}
.gapbox.filled{border-style:solid}
.gapbox.good{border-color:var(--good);background:var(--good-soft);color:var(--good-ink)}
.gapbox.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.chunks{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.chunk{min-width:72px;height:64px;padding:0 16px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);cursor:pointer;font-family:var(--display);font-weight:800;font-size:1.8rem}
.chunk:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.chunk.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.chunk:disabled{cursor:default;opacity:.6}

.tile{--ts:50px;position:relative;width:var(--ts);height:var(--ts);border-radius:calc(var(--ts)*.22);border:2px solid var(--tile-d);padding:0;background:var(--tile);color:var(--ink);
  font-family:var(--display);font-weight:800;font-size:calc(var(--ts)*.54);line-height:1;display:grid;place-items:center;box-shadow:0 4px 0 var(--tile-d);cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .1s,opacity .2s}
.tile .v{position:absolute;right:calc(var(--ts)*.09);bottom:calc(var(--ts)*.04);font-family:var(--body);font-size:calc(var(--ts)*.2);font-weight:800;opacity:.45}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tile-d)}
.tile.used{opacity:.15;pointer-events:none;box-shadow:none}
.slots{display:flex;justify-content:center;flex-wrap:nowrap;gap:6px}
.slot{--ts:50px;width:var(--ts);height:var(--ts);border-radius:calc(var(--ts)*.22);border:3px dashed var(--line);background:var(--surface2);padding:0;cursor:pointer;display:grid;place-items:center;flex:none}
.slot.next{border-color:var(--primary);border-style:solid}
.slot .tile{width:100%;height:100%;pointer-events:none;animation:pop .2s ease}
.slot.wrong .tile{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);color:var(--bad-ink)}
.slot.right .tile{background:var(--good-soft);border-color:var(--good);box-shadow:0 4px 0 var(--good);color:var(--good-ink)}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.pool .tile{--ts:clamp(44px,12vw,54px)}
.flash{display:flex;flex-direction:column;align-items:center;gap:12px}
.flash .bar{width:min(260px,70%);height:8px;border-radius:9px;background:var(--locked);overflow:hidden}
.flash .bar i{display:block;height:100%;background:var(--primary);transform-origin:left;animation:shrink 3.4s linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.minibtns{display:flex;justify-content:center;gap:10px}
.smallbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);cursor:pointer;font-weight:800;font-size:.9rem;color:var(--muted)}
.smallbtn svg{width:16px;height:16px}
.smallbtn:active{transform:translateY(2px);border-bottom-width:2px}

.lfoot{border-top:2px solid var(--line);background:var(--bg);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lfoot.good{background:var(--good-soft);border-color:transparent}
.lfoot.bad{background:var(--bad-soft);border-color:transparent}
.fin{max-width:640px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fin > .bigbtn{min-width:170px}
.lfoot.good .fin,.lfoot.bad .fin{animation:rise .25s ease}
.res{display:flex;gap:12px;align-items:flex-start;flex:1;min-width:230px}
.res .ic{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.res .ic svg{width:28px;height:28px}
.lfoot.good .res .ic{color:var(--good)} .lfoot.bad .res .ic{color:var(--bad)}
.res h3{margin:0;font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.2}
.lfoot.good h3{color:var(--good-ink)} .lfoot.bad h3{color:var(--bad-ink)}
.res .rw{font-family:var(--display);font-weight:800;font-size:1.4rem;letter-spacing:.02em}
.lfoot.good .rw{color:var(--good-ink)} .lfoot.bad .rw{color:var(--bad-ink)}
.lfoot mark.hot{color:inherit;box-shadow:inset 0 -4px 0 currentColor;opacity:1}
.res p{margin:4px 0 0;font-weight:700;color:var(--bad-ink);opacity:.9}
.foothint{color:var(--muted);font-weight:700;font-size:.9rem;text-align:center;width:100%}
.footrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){.fin > .bigbtn,.footrow{width:100%} .footrow .bigbtn{flex:1}}

/* done screens */
.done{align-items:center;justify-content:center;text-align:center;overflow-y:auto}
.dinner{max-width:520px;width:100%;margin:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:18px}
.dinner .mascot{width:150px}
.dtitle{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2rem,8vw,2.8rem);line-height:1.05;color:var(--gold-d)}
html[data-dark] .dtitle{color:var(--gold)}
.dsub{margin:-8px 0 0;color:var(--muted);font-weight:700;max-width:40ch}
.dstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.dstat{border-radius:16px;border:2px solid var(--c);overflow:hidden;background:var(--c);animation:pop .4s ease both}
.dstat span{display:block;color:#fff;font-weight:900;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:5px 4px}
.dstat b{display:flex;align-items:center;justify-content:center;gap:4px;background:var(--surface);border-radius:12px 12px 14px 14px;padding:12px 4px;font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--c);font-variant-numeric:tabular-nums}
.dstat b svg{width:20px;height:20px}
.reward{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-weight:900;font-size:1.1rem;animation:pop .4s ease .5s both}
.reward svg{width:28px;height:28px}
.dbtns{display:flex;flex-direction:column;gap:6px;width:100%}
.bigflame{width:130px;height:130px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.streaknum{font-family:var(--display);font-weight:800;font-size:4.5rem;line-height:1;color:#FF8A1F;margin-top:-22px;animation:pop .6s ease .2s both}
.week{display:flex;gap:8px;justify-content:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:.8rem;color:var(--muted)}
.day i{width:30px;height:30px;border-radius:50%;background:var(--locked);display:grid;place-items:center}
.day.on i{background:#FF8A1F;color:#fff}
.day.on i svg{width:18px;height:18px}
.day.today{color:#FF8A1F}
.chestbig{width:180px;height:160px;cursor:pointer;border:0;background:none;padding:0}
.chestbig svg{width:100%;height:100%}
.chestbig.shakey{animation:wobble 1s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.chestbig .lid{transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:10px 36px}
.chestbig.open .lid{transform:rotate(-28deg) translate(-6px,-10px)}

/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sitem{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:16px;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;cursor:pointer;text-align:center}
.sitem:active{transform:translateY(3px);border-bottom-width:2px}
.sitem .prev{width:70px;height:70px}
.sitem .nm{font-weight:800;font-size:.9rem;line-height:1.2}
.sitem .pr{display:inline-flex;align-items:center;gap:3px;font-weight:900;font-size:.85rem;color:#1C9BE0}
.sitem .pr svg{width:16px;height:16px}
.sitem .pr.own{color:var(--muted)} .sitem .pr.on{color:var(--good-ink)}
.sitem.worn{border-color:var(--good)}
.sitem.lockedi{opacity:.6}
.swatch{width:70px;height:70px;border-radius:18px;display:grid;place-items:center;border:2px solid rgba(0,0,0,.08)}
.swatch i{width:30px;height:30px;border-radius:10px}
.tabs{display:flex;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:4px}
.tab{flex:1;padding:10px;border-radius:12px;border:0;background:none;cursor:pointer;font-weight:900;letter-spacing:.05em;text-transform:uppercase;font-size:.88rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--primary-soft);color:var(--primary)}
.shophead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shophead h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.6rem}

/* ---------- space game ---------- */
#space{background:#0A0B22;color:#F3F0FF;z-index:40;padding-top:0}
#scv{position:absolute;inset:0;width:100%;height:100%;display:block}
.shud{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-inline:12px;max-width:640px;margin:0 auto;z-index:2}
.shud .xbtn{color:#C9C3FF}
.shud .xbtn:hover{background:rgba(255,255,255,.08)}
.shields{display:flex;gap:4px}
.shields svg{width:26px;height:26px}
.shields .on{color:#5FE3FF;filter:drop-shadow(0 0 6px rgba(95,227,255,.7))} .shields .off{color:rgba(255,255,255,.18)}
.sscore{font-family:var(--display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.scombo{font-weight:900;color:#FFB020;font-size:.95rem;white-space:nowrap}
.swcard{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);width:min(calc(100% - 32px),440px);z-index:2;
  text-align:center;padding:12px 16px 14px;border-radius:20px;background:rgba(20,18,64,.78);border:2px solid rgba(160,150,255,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.swcard .q{font-weight:800;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:#B7AEFF}
.swcard .sw{font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,2.8rem);letter-spacing:.03em;line-height:1.15;overflow-wrap:anywhere}
.swcard .sw s{text-decoration-color:#FF6B81;text-decoration-thickness:4px;opacity:.7}
.swcard .sw mark.hot{color:#FFD66B;box-shadow:inset 0 -4px 0 rgba(255,214,107,.4)}
.swcard .sub{font-weight:800;font-size:.95rem;min-height:1.4em}
.swcard.ok{border-color:#4FE0AE;box-shadow:0 0 30px -8px #4FE0AE}
.swcard.no{border-color:#FF6B81;box-shadow:0 0 30px -8px #FF6B81}
.swcard .sub.ok{color:#7FF0C8} .swcard .sub.no{color:#FFB0BD}
.sbtns{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(calc(100% - 32px),480px);display:grid;grid-template-columns:1fr 1fr;gap:12px;z-index:2}
.sbtn{min-height:64px;padding:0 8px;white-space:nowrap;border-radius:18px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:900;font-size:clamp(.9rem,3.8vw,1.1rem);letter-spacing:.03em;color:#fff;transition:transform .08s,box-shadow .08s}
.sbtn svg{width:26px;height:26px}
.sbtn.l{background:#FF5A72;box-shadow:0 5px 0 #B8304A}
.sbtn.r{background:#23C47E;box-shadow:0 5px 0 #138A57}
.sbtn:active:not(:disabled){transform:translateY(5px);box-shadow:none}
.sbtn:disabled{opacity:.45;cursor:default}
.sintro{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,8,30,.55)}
.sbox{width:min(100%,440px);background:#17154A;border:2px solid rgba(160,150,255,.35);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;text-align:center;animation:pop .4s ease}
.sbox h2{margin:0;font-family:var(--display);font-weight:800;font-size:2rem;background:linear-gradient(90deg,#FFD66B,#FF8AD8,#8FD3FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.sbox p{margin:0;color:#D6D1FF;font-weight:700}
.sdiag{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.sdiag div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;font-weight:700;font-size:.92rem;color:#D6D1FF}
.sdiag b{display:block;font-size:1rem}
.sdiag .l b{color:#FF9AAA} .sdiag .r b{color:#7FF0C8}
.countdown{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none;font-family:var(--display);font-weight:800;font-size:7rem;color:#fff;text-shadow:0 0 40px #8B7CFF}
.countdown span{animation:pop .5s ease}

/* shop preview */
.pcard{gap:14px;max-height:92vh;overflow-y:auto}
.pstage{height:250px;border-radius:22px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,var(--primary-soft),var(--surface2) 70%);border:2px solid var(--line);overflow:hidden}
.pstage .mascot{width:190px;animation:pop .4s ease}
.pstage.dark{background:#0B0C24;border-color:#2A2466}
.pstage canvas{width:100%;height:100%;display:block}
.pinfo{display:flex;flex-direction:column;align-items:center;gap:4px}
.pinfo h3{font-size:1.6rem}
.pprice{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:1.4rem;color:#1C9BE0;margin-top:4px}
.pprice svg{width:26px;height:26px}
.pprice small{font-family:var(--body);font-size:.85rem;font-weight:700;color:var(--muted);margin-left:6px}
.bigbtn .gemi,.bigbtn svg{flex:none}
.shipthumb{width:70px;height:70px;border-radius:18px;display:block}
.tthumb{width:70px;height:70px;border-radius:18px;background:linear-gradient(160deg,var(--bg),var(--bg2));border:2px solid var(--line);position:relative;display:block}
.tthumb i{position:absolute;display:block}
.tthumb .b{left:10px;right:10px;top:10px;height:12px;border-radius:6px;background:var(--surface);border:1.5px solid var(--line)}
.tthumb .n{left:12px;top:32px;width:24px;height:22px;border-radius:50%;background:var(--primary);box-shadow:0 3px 0 var(--primary-d)}
.tthumb .g{right:12px;top:34px;width:18px;height:18px;border-radius:6px;background:var(--m-body)}
.tmock{color:var(--text);background:linear-gradient(170deg,var(--bg),var(--bg2));border:2px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;text-align:left}
.tmock .mrow .mascot{width:70px}
.tmock .bubble{font-size:.95rem;margin-bottom:10px}
.tmrow{display:flex;justify-content:center;gap:14px;padding-bottom:6px}
.tmock .choice{padding:10px 14px}
.tmock .choice .cw{font-size:1.2rem}
.sitem .prev .mascot{width:70px;height:70px}
.tabs .tab{padding:10px 4px;font-size:.8rem}

/* ---------- courses ---------- */
.trackchip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 8px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text);font-weight:900;font-size:.95rem;cursor:pointer;min-width:0;max-width:52vw}
.trackchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trackchip .chev{width:16px;height:16px;flex:none;color:var(--muted)}
.flag{width:26px;height:18px;border-radius:4px;flex:none;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.art{font-weight:900}
.art.der{color:#3D7BFF} .art.die{color:#F0405A} .art.das{color:#1FAE66}
.eq{color:var(--muted);font-weight:700;padding:0 2px}
.muted{color:var(--muted)}
.meaning{text-align:center;font-weight:800;font-size:1.3rem;color:var(--muted);margin-top:-6px}
.artline{display:flex;justify-content:center;font-family:var(--display);font-size:1.6rem}
.artchip{min-width:96px}
.artchip.der{color:#3D7BFF} .artchip.die{color:#F0405A} .artchip.das{color:#1FAE66}
.wline{min-height:62px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:8px 0 10px;border-bottom:2px solid var(--line);background:repeating-linear-gradient(transparent 0 58px,var(--line) 58px 60px)}
.wpool{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.wchip{padding:10px 14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);cursor:pointer;font-weight:800;font-size:1.1rem;color:var(--text);animation:pop .2s ease}
.wchip:active{transform:translateY(3px);border-bottom-width:2px}
.wchip.used{opacity:.18;pointer-events:none}
.wchip.right{border-color:var(--good);background:var(--good-soft);color:var(--good-ink)}
.wchip.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mbtn{min-height:58px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);cursor:pointer;font-weight:800;font-size:1rem;color:var(--text);overflow-wrap:anywhere;transition:opacity .3s}
.mbtn.sel{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.mbtn.ok{border-color:var(--good);background:var(--good-soft);color:var(--good-ink);opacity:.45;pointer-events:none}
.mbtn.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink);animation:shake .45s ease}
.vtable{display:flex;flex-direction:column;gap:8px;background:var(--tile);color:var(--ink);border:2px solid var(--tile-d);box-shadow:0 6px 0 var(--tile-d);border-radius:20px;padding:16px 18px}
.vtable div{display:flex;align-items:center;gap:12px;font-size:1.3rem}
.vtable span{width:4.5em;color:#6C6690;font-weight:700}
.vtable b{flex:1;font-family:var(--display);font-weight:800;font-size:1.6rem}
details.glossary{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
details.glossary summary{cursor:pointer;font-weight:900}
details.glossary h3{margin:14px 0 6px;font-family:var(--display);font-size:1.05rem}
.grow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.grow .gf{flex:1.1;font-weight:800;min-width:0;overflow-wrap:anywhere}
.grow .gs{flex:1;color:var(--muted);font-weight:700;min-width:0;overflow-wrap:anywhere}
.grow .speak{width:30px;height:30px;border-radius:10px}
.grow .stars svg{width:13px;height:13px}
.emptycard,.testcard{margin-top:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.emptycard{align-items:center;text-align:center}
.emptycard .flag{width:48px;height:32px}
.emptycard span{color:var(--muted);font-weight:700}
.testcard{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,190,26,.12),var(--surface))}
.testcard .kicker{color:var(--gold-d)}
html[data-dark] .testcard .kicker{color:var(--gold)}
.tparts{display:flex;flex-wrap:wrap;gap:6px}
.tparts span{padding:4px 10px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);font-weight:800;font-size:.85rem}
.trackrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);cursor:pointer;text-align:left;color:var(--text)}
.trackrow .flag{width:34px;height:24px}
.trackrow span{flex:1;display:flex;flex-direction:column}
.trackrow b{font-size:1.05rem}
.trackrow small{color:var(--muted);font-weight:700}
.trackrow > svg:last-child{width:22px;height:22px;color:var(--good)}
.trackrow.on{border-color:var(--primary);background:var(--primary-soft)}
.wholine{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px;color:var(--muted);font-weight:700}
.whohead{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:20px}
.whohead .mascot{width:110px}
.whohead h2{margin:0;font-family:var(--display);font-weight:800;font-size:2rem}
.whogrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.whocard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border-radius:20px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);cursor:pointer;color:var(--text)}
.whocard .mascot{width:84px}
.whocard b{font-family:var(--display);font-size:1.25rem}
.whocard small{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:800}
.whocard small .flag{width:20px;height:14px}
.whocard.on{border-color:var(--primary)}
.whocard.add{justify-content:center;border-style:dashed}
.whocard .plus{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-size:2.2rem;font-weight:900}
.newp{display:flex;flex-direction:column;gap:10px}
.newp h3{margin:0;text-align:center;font-family:var(--display);font-size:1.4rem}
.tpick{display:flex;flex-direction:column;gap:8px}
#newName,#renameIn{width:100%;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--text);padding:0 14px;font:800 1.1rem var(--body)}
#newName:focus,#renameIn:focus{outline:none;border-color:var(--primary)}
.codebox{width:100%;min-height:120px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--text);padding:10px;font:600 .8rem/1.4 ui-monospace,Menlo,monospace}
.smean{font-weight:800;font-size:1.05rem;color:#D6D1FF;min-height:1.2em}
.smean s{text-decoration-color:#FF6B81;text-decoration-thickness:3px;opacity:.7}
.swcard .art.der{color:#7FA8FF} .swcard .art.die{color:#FF8A9C} .swcard .art.das{color:#6BE3A5}
.topbar .trackchip{flex:0 1 auto;max-width:none}
.tshort{display:none}
@media (max-width:400px){ .tfull{display:none} .tshort{display:inline} }
.topbar .stats-row{flex:none}
@media (max-width:440px){ #shopBtn{display:none} .stats-row{gap:2px} .stats-row .chip{padding:0 6px} .stats-row .chip.icon{width:34px} .trackchip{padding:0 8px 0 6px;gap:6px;font-size:.9rem} }

/* sheet */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(10,8,30,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:640px;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:rise .25s ease;text-align:center}
.sheet h3{margin:0;font-family:var(--display);font-weight:800;font-size:1.4rem}
.sheet p{margin:0;color:var(--muted);font-weight:700}

dialog{border:2px solid var(--line);border-radius:22px;background:var(--surface);color:var(--text);padding:20px;width:min(460px,calc(100vw - 32px));box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,30,.55)}
dialog h2{margin:0 0 6px;font-family:var(--display);font-weight:800}
dialog p{margin:0 0 12px;color:var(--muted);font-size:.95rem}
dialog textarea{width:100%;min-height:200px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--text);padding:12px;font:600 1rem/1.6 var(--body);resize:vertical}
.dlgbtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.err{color:var(--bad-ink);font-size:.9rem;min-height:1.2em;margin-top:6px;font-weight:700}

@media (max-width:480px){
  .shopgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero .mascot{width:92px}
  .ptitle{font-size:1.35rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .flash .bar i{animation-duration:3.4s!important}
}
</style>
</head>

/* ================= speech ================= */
const VOICES = {};
function findVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    VOICES.sv = vs.find(v => /^sv[-_]SE/i.test(v.lang)) || vs.find(v => /^sv/i.test(v.lang)) || null;
    VOICES.de = vs.find(v => /^de[-_]DE/i.test(v.lang)) || vs.find(v => /^de/i.test(v.lang)) || null;
    VOICES.en = vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  }catch(e){}
  document.querySelectorAll('[data-say]').forEach(b => b.hidden = !VOICES[b.dataset.lang || 'sv']);
}
try{ if ('speechSynthesis' in window){ findVoice(); speechSynthesis.onvoiceschanged = findVoice; } }catch(e){}
const hasVoice = lang => !!VOICES[lang || 'sv'];
function speak(t, lang){ const v = VOICES[lang || 'sv']; if (!v) return; try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(String(t).replace(/…/g,'')); u.voice = v; u.lang = v.lang; u.rate = .85; speechSynthesis.speak(u); }catch(e){} }
function speakBtn(w, lang){ lang = lang || 'sv'; return '<button class="speak" data-say="'+esc(w)+'" data-lang="'+lang+'" aria-label="Lyssna"'+(hasVoice(lang)?'':' hidden')+'>'+I.speak+'</button>'; }
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b){ e.stopPropagation(); speak(b.dataset.say, b.dataset.lang); } }, true);

/* ================= sound ================= */
let AC = null;
function ac(){ if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f,t0,dur,type,vol,slide){
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type||'sine'; o.frequency.setValueAtTime(f,t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.12,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function noise(dur,vol){
  const a = ac(); if (!a) return;
  const b = a.createBuffer(1, a.sampleRate*dur, a.sampleRate), d = b.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 2);
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 900; s.buffer = b; g.gain.value = vol||.35;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function sfx(k){
  if (ST && ST.muted) return;
  switch(k){
    case 'ok': [784,988,1319].forEach((f,i) => tone(f,i*.06,.3,'sine',.12)); tone(2637,.16,.4,'triangle',.03); break;
    case 'bad': tone(311,0,.2,'square',.05); tone(233,.1,.35,'triangle',.12); break;
    case 'tap': tone(700+Math.random()*140,0,.06,'triangle',.05); break;
    case 'select': tone(523,0,.07,'triangle',.06); tone(784,.04,.08,'triangle',.05); break;
    case 'combo': [1047,1319,1568,2093].forEach((f,i) => tone(f,i*.05,.3,'sine',.09)); break;
    case 'win': [523,659,784,1047,1319,1568].forEach((f,i) => tone(f,i*.1,.55,'sine',.1)); tone(262,0,.9,'triangle',.06); break;
    case 'chest': tone(196,0,.15,'square',.05); [659,880,1175,1568,2093].forEach((f,i) => tone(f,.25+i*.07,.4,'sine',.1)); break;
    case 'buy': [880,1175,1760].forEach((f,i) => tone(f,i*.05,.2,'triangle',.08)); break;
    case 'streak': [392,523,659,784].forEach((f,i) => tone(f,i*.12,.5,'triangle',.1)); break;
    case 'whoosh': tone(900,0,.25,'sawtooth',.025,300); break;
    case 'boom': noise(.6,.5); tone(120,0,.5,'sine',.25,40); break;
    case 'dodge': tone(660,0,.12,'sine',.08,1320); tone(1320,.08,.25,'triangle',.05); break;
    case 'tick': tone(1400,0,.04,'square',.03); break;
  }
}

function burst(x,y,n,power,cols){
  n = RM ? Math.min(n||28, 8) : (n||28); power = power||1;
  for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = (1.5+Math.random()*5)*power;
    P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,g:.12,life:1,decay:.014+Math.random()*.02,size:4+Math.random()*8,rot:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols||COLS),k:Math.random()<.6?'star':'dot'}); }
  runFx();
}
function burstEl(el,n,p){ if (!el) return; const [x,y] = centerOf(el); burst(x,y,n,p); }
function confetti(){
  const n = RM ? 20 : 170;
  for (let i=0;i<n;i++) P.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.03,life:1,decay:.0035,size:7+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.25,c:pick(COLS),k:Math.random()<.75?'rect':'star'});
  runFx();
}
function runFx(){ if (!raf) raf = requestAnimationFrame(drawFx); }
function drawStar(c,s){ c.beginPath(); for (let i=0;i<8;i++){ const r = i%2 ? s*.26 : s, a = i*Math.PI/4; c.lineTo(Math.cos(a)*r, Math.sin(a)*r); } c.closePath(); c.fill(); }
function drawFx(){
  cx.setTransform(DPR,0,0,DPR,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
  P = P.filter(p => p.life > 0 && p.y < innerHeight+40);
  for (const p of P){
    p.vy += p.g; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
    cx.globalAlpha = Math.max(0, Math.min(1, p.life*1.4)); cx.fillStyle = p.c;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
    if (p.k === 'star') drawStar(cx,p.size); else if (p.k === 'rect') cx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2); else { cx.beginPath(); cx.arc(0,0,p.size/3,0,Math.PI*2); cx.fill(); }
    cx.restore();
  }
  cx.globalAlpha = 1; raf = P.length ? requestAnimationFrame(drawFx) : 0;
}
function floaty(t,x,y,color){ const d = document.createElement('div'); d.className = 'floaty'; d.textContent = t; d.style.left = x+'px'; d.style.top = y+'px'; if (color) d.style.color = color; document.body.appendChild(d); setTimeout(() => d.remove(), 1200); }
let toastT = 0;
function toast(t){ document.querySelectorAll('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 2200); }
function ask(title, text, yes, no){
  return new Promise(res => {
    const s = document.createElement('div'); s.className = 'sheet';
    s.innerHTML = '<div class="card"><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p><button class="bigbtn" data-a="0">'+esc(no)+'</button><button class="textbtn" data-a="1" style="color:var(--bad)">'+esc(yes)+'</button></div>';
    s.onclick = e => { const b = e.target.closest('[data-a]'); if (b || e.target === s){ s.remove(); res(b ? b.dataset.a === '1' : false); } };
    document.body.appendChild(s);

function coursePath(){
  if (TRACK.kind === 'spell'){
    // Week 40 keeps the original node ids so earlier progress still counts.
    const units = SPELL_UNITS.map((u,i) => { const pre = u.id === 'v40' ? '' : u.id+':';
      return {title:u.name, sub:'Del '+(i+1)+(u.sub ? ' · '+u.sub : ''), nodes:[
        {id:pre+'intro', name:'Lär känna orden', icon:'book', plan:'intro', sec:u.id},
        {id:pre+'choose', name:'Välj rätt', icon:'choice', plan:'choose', sec:u.id},
        {id:pre+'gap', name:'Saknad bokstav', icon:'gap', plan:'gap', sec:u.id},
        {id:pre+'build', name:'Bygg ordet', icon:'tiles', plan:'build', sec:u.id},
      ].concat(i % 2 === 1 ? [{id:pre+'chest1', name:'Skattkista', kind:'chest'}] : [])}; });
    units.push({title:'Alla ord', sub:'Repetition', nodes:[
      {id:'space', name:'Rymdfärden', icon:'rocket', kind:'space'},
      {id:'mix', name:'Blandat', icon:'mix', plan:'mix'},
      {id:'chest2', name:'Skattkista', kind:'chest'},
      {id:'boss', name:'Mästarprovet', icon:'crown', kind:'boss', plan:'boss'}]});
    return units;
  }
  const units = SECTIONS.map((s,i) => ({title:s.name, sub:'Del '+(i+1)+(s.sub ? ' · '+s.sub : ''), nodes:[
    {id:s.id+':learn', name:'Lär dig', icon:'book', plan:'learn', sec:s.id},
    {id:s.id+':practice', name:'Öva', icon:'mix', plan:'practice', sec:s.id},
    {id:s.id+':build', name:'Bygg', icon:'tiles', plan:'buildL', sec:s.id},
  ].concat(i % 2 === 1 ? [{id:s.id+':chest', name:'Skattkista', kind:'chest'}] : [])}));
  if (VERBS.length) units.push({title:'Verb i presens', sub:'Del '+(units.length+1)+' · ich, du, er/sie', nodes:[
    {id:'verbs:learn', name:'Lär dig', icon:'book', plan:'verbsLearn'}, {id:'verbs:practice', name:'Öva', icon:'mix', plan:'verbs'}]});
  if (SECTIONS.length) units.push({title:'Hela kursen', sub:TRACK.test ? 'Inför '+TRACK.test.title.toLowerCase() : 'Repetition', nodes:[

}

document.addEventListener('click', e => {
  const nb = e.target.closest('[data-node]');
  if (nb){ const hit = findNode(nb.dataset.node); if (!hit) return; const {u, i, n} = hit;
    if (!nodeUnlocked(u, i)){ nb.classList.remove('shake'); void nb.offsetWidth; nb.classList.add('shake'); toast('Klara steget innan först!'); return; }
    ac(); sfx('select');
    if (n.kind === 'chest') return openChest(n, nodeDone(n));
    if (n.kind === 'space') return startSpace(n);
    return startLesson(n);
  }
  if (e.target.closest('#spaceCard')){ ac(); sfx('select'); return startSpace({id:'space', kind:'space', name:'Rymdfärden'}); }
  if (e.target.closest('#practiceBtn')){ ac(); return startLesson({id:'practice', name:'Öva', plan: TRACK.kind === 'spell' ? 'mix' : 'mixAll'}); }
  if (e.target.closest('#editBtn') || e.target.closest('#emptyEdit')) return openEditor();
  if (e.target.closest('#renameBtn')) return renameSheet();
  if (e.target.closest('#copyCode')) return copySaveCode();
  if (e.target.closest('#loadCode')) return loadSaveSheet();
});

        document.querySelectorAll('.slot').forEach((s,k) => s.classList.add(tiles[slots[k]].c === w[k] ? 'right' : 'wrong'));
        if (ok && hints){ L.xp -= Math.min(5, hints*2); }
        grade(ok, $('#slots'));
      }
    };
  },
};
function fitSlots(){
  const el = $('#slots'); if (!el || !el.children.length) return;
  const n = el.children.length, W = el.clientWidth || el.parentElement.clientWidth, gap = n > 12 ? 3 : n > 10 ? 4 : 6;
  const ts = Math.max(18, Math.min(56, Math.floor((W - gap*(n-1))/n)));
  // Very long words (busshållplatsen) wrap onto two rows instead of shrinking the tiles to crumbs.
  const wrap = ts < 28, size = wrap ? 34 : ts;
  el.style.flexWrap = wrap ? 'wrap' : 'nowrap'; el.style.rowGap = wrap ? '8px' : '';
  el.style.gap = (wrap ? 4 : gap)+'px'; [...el.children].forEach(s => s.style.setProperty('--ts', size+'px'));
}

  addXp(xp); ST.gems += gems;
  if (n.id !== 'practice'){ const nd = TS().nodes[n.id] || (TS().nodes[n.id] = {c:0}); nd.c = Math.min(3, nd.c+1); }
  let crown = false; if (n.kind === 'boss' && !ST.items.includes('krona')){ ST.items.push('krona'); crown = true; }

  const secs = Math.round((Date.now() - L.t0)/1000);
  const acc = Math.round(100*L.ok/Math.max(1, L.answered));

  showDone({
    title: n.kind === 'boss' ? 'Mästarprovet klart!' : perfect ? 'Perfekt lektion!' : 'Lektion klar!',
    sub: crown ? 'Du har låst upp kronan åt Glimt. Sätt på den i butiken!' : perfect ? 'Inte ett enda fel. Snyggt!' : 'Det du missade kommer tillbaka nästa gång.',
    stats:[{label:'Totalt XP', val:xp, icon:I.bolt, c:'#FFB020'},{label:perfect?'Felfri':'Träff', val:acc, suf:'%', icon:I.target, c:'#22C07A'},{label:'Tid', val:secs, time:true, icon:I.clock, c:'#3EC5FF'}],
    gems, streakUp, goalNow: !beforeGoal && todayXp() >= ST.goal

  const neb = c.createRadialGradient(S.W*.8,S.H*.25,10,S.W*.8,S.H*.25,S.W*.6); neb.addColorStop(0,'rgba(140,90,255,.22)'); neb.addColorStop(1,'rgba(140,90,255,0)'); c.fillStyle = neb; c.fillRect(0,0,S.W,S.H);
  if (S.shake > 0){ c.translate((Math.random()-.5)*16*S.shake, (Math.random()-.5)*16*S.shake); }
  for (const st of S.stars){ c.globalAlpha = .35 + st.z*.6; c.fillStyle = '#fff'; const len = speed > .2 ? st.z*speed*14 : 0; c.fillRect(st.x*S.W, st.y*S.H, st.z*1.8, st.z*1.8 + len); }
  c.globalAlpha = 1;
  // lanes
  c.strokeStyle = 'rgba(160,150,255,.12)'; c.lineWidth = 2; c.setLineDash([10,14]); c.lineDashOffset = -(now/40)%24;
  for (let i=1;i<3;i++){ const x = S.left0 + S.playW*i/3; c.beginPath(); c.moveTo(x, S.y0 - 10); c.lineTo(x, S.H); c.stroke(); }
  c.setLineDash([]);
  // free lane glow
  if (S.phase === 'wave' && S.cur){
    const fx = laneX(S.cur.free), w = S.playW/3;
    const lg = c.createLinearGradient(0, S.y0, 0, S.shipY + 40);
    lg.addColorStop(0, 'rgba(79,224,174,0)'); lg.addColorStop(1, 'rgba(79,224,174,.16)');
    c.fillStyle = lg; c.fillRect(fx - w/2 + 6, S.y0, w - 12, S.shipY + 40 - S.y0);
    c.fillStyle = 'rgba(127,240,200,.75)'; c.font = '800 13px Nunito, system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('FRI', fx, S.shipY + 4);
  }
  // rocks
  if (S.phase === 'wave' || S.phase === 'post'){
    const y = rockY();
    for (const r of S.rocks){
      if (r.kind === 'gone') continue;
      const x = laneX(r.lane);
      c.save(); c.translate(x, y); c.rotate(r.rot);
      if (r.kind === 'hidden' || r.kind === 'dust'){
        c.fillStyle = 'rgba(170,160,230,.13)'; c.strokeStyle = 'rgba(200,190,255,.45)'; c.lineWidth = 2; c.setLineDash([5,6]);
        pathRock(c, r.shape); c.fill(); c.stroke(); c.setLineDash([]);
        c.rotate(-r.rot); c.fillStyle = 'rgba(255,255,255,.6)'; c.font = '800 '+Math.round(S.r*.9)+'px "Bricolage Grotesque", system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 0, 2);
      } else {
        c.globalAlpha = r.alpha;
        c.shadowColor = 'rgba(255,120,80,.35)'; c.shadowBlur = 18;
        c.fillStyle = '#8F84A6'; pathRock(c, r.shape); c.fill(); c.shadowBlur = 0;
        c.strokeStyle = '#5C5270'; c.lineWidth = 3; c.stroke();
        c.fillStyle = '#6F6589'; for (const [cx2,cy2,cr] of r.shape.cr){ c.beginPath(); c.arc(cx2*.6, cy2*.6, cr, 0, Math.PI*2); c.fill(); }
        c.fillStyle = 'rgba(255,255,255,.12)'; c.beginPath(); c.arc(-S.r*.3, -S.r*.35, S.r*.25, 0, Math.PI*2); c.fill();
      }
      c.restore(); c.globalAlpha = 1;
    }
  }
  // ship
  if (S.phase !== 'over' && !(S.flick > 0 && Math.floor(now/80)%2)) drawShip(c, S.shipX, S.shipY, now/1000, (tx - S.shipX)*.01, ST.ship, S.mcol);
  // particles
  for (const p of S.sp){ c.globalAlpha = Math.max(0, p.life); c.fillStyle = p.c; c.save(); c.translate(p.x,p.y); drawStar(c, p.size); c.restore(); }
  c.globalAlpha = 1;
}
function pathRock(c, s){ c.beginPath(); s.pts.forEach(([x,y],i) => i ? c.lineTo(x,y) : c.moveTo(x,y)); c.closePath(); }
function pilotColor(){
  const col = COLORS.find(c => c.id === ST.color);
  if (col && col.body) return col.body;
  if (col && col.rainbow) return '#FF5FAE';
  return getComputedStyle(document.documentElement).getPropertyValue('--m-body').trim() || '#7A4DFF';
}
function drawShip(c, x, y, t, tilt, shipId, pilot, scale){
  const sh = SHIPS.find(v => v.id === (shipId || ST.ship)) || SHIPS[0];
  pilot = pilot || (SG && SG.mcol) || '#7A4DFF';
  c.save(); c.translate(x, y); if (scale) c.scale(scale, scale); c.rotate(Math.max(-.35, Math.min(.35, tilt || 0)));
  if (sh.ufo){
    const bob = Math.sin(t*3)*2;
    c.translate(0, bob);
    const beam = c.createLinearGradient(0,6,0,44); beam.addColorStop(0,'rgba(127,240,200,.55)'); beam.addColorStop(1,'rgba(127,240,200,0)');
    c.fillStyle = beam; c.beginPath(); c.moveTo(-12,6); c.lineTo(12,6); c.lineTo(22,44); c.lineTo(-22,44); c.closePath(); c.fill();
    c.fillStyle = '#46D7FF'; c.globalAlpha = .9; c.beginPath(); c.ellipse(0,-8,15,15,0,Math.PI,0); c.fill(); c.globalAlpha = 1;
    c.fillStyle = pilot; c.beginPath(); c.arc(0,-8,7,0,Math.PI*2); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(-2.5,-10,1.8,0,Math.PI*2); c.arc(2.5,-10,1.8,0,Math.PI*2); c.fill();
    c.fillStyle = '#A7B0C8'; c.beginPath(); c.ellipse(0,0,34,10,0,0,Math.PI*2); c.fill();
    c.fillStyle = '#7F89A6'; c.beginPath(); c.ellipse(0,3,34,6,0,0,Math.PI); c.fill();
    const lc = ['#FF5FD2','#FFD66B','#4FE0AE','#3EC5FF'];
    for (let i=0;i<6;i++){ c.fillStyle = lc[(i + Math.floor(t*6)) % lc.length]; c.beginPath(); c.arc(-25 + i*10, 1, 2.6, 0, Math.PI*2); c.fill(); }
    c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-5,-16,3,4,-.5,0,Math.PI*2); c.fill();
    c.restore(); return;
  }
  const f = 16 + Math.sin(t*45)*4 + Math.random()*5;
  c.fillStyle = sh.flame[0]; c.beginPath(); c.moveTo(-9,24); c.lineTo(0,24+f); c.lineTo(9,24); c.fill();
  c.fillStyle = sh.flame[1]; c.beginPath(); c.moveTo(-5,24); c.lineTo(0,24+f*.6); c.lineTo(5,24); c.fill();
  c.fillStyle = sh.wing; c.beginPath(); c.moveTo(-9,-2); c.lineTo(-32,22); c.lineTo(-28,29); c.lineTo(-8,21); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(9,-2); c.lineTo(32,22); c.lineTo(28,29); c.lineTo(8,21); c.closePath(); c.fill();
  c.fillStyle = sh.hull; c.beginPath(); c.moveTo(0,-36); c.bezierCurveTo(15,-22,15,8,11,25); c.lineTo(-11,25); c.bezierCurveTo(-15,8,-15,-22,0,-36); c.fill();
  c.fillStyle = sh.stripe || pilot; c.fillRect(-11,15,22,6);
  c.fillStyle = sh.glass; c.beginPath(); c.ellipse(0,-11,7,10,0,0,Math.PI*2); c.fill();
  c.fillStyle = pilot; c.beginPath(); c.arc(0,-8,4.2,0,Math.PI*2); c.fill();
  c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.ellipse(-2.5,-15,2,3.5,0,0,Math.PI*2); c.fill();
  c.restore();
}
function endSpace(){
  if (!SG) return;
  const S = SG; S.running = false;
  const rec = S.score > TS().spaceBest; if (rec) TS().spaceBest = S.score;
  const xp = Math.max(2, S.dodged*2), gems = 3 + Math.floor(S.dodged/4);
  const beforeGoal = todayXp() >= ST.goal;
  addXp(xp); ST.gems += gems;
  const hitN = findNode('space');
  if (hitN && nodeUnlocked(hitN.u, hitN.i)){
    const nd = TS().nodes.space || (TS().nodes.space = {c:0});
    nd.c = Math.max(nd.c, S.dodged >= 25 ? 3 : S.dodged >= 15 ? 2 : 1);
  }
  const streakUp = bumpStreak(); save();
  SG = null;
  showDone({
    title: rec ? 'Nytt rekord!' : 'Landning klar!',
    sub: S.answered ? 'Du styrde rätt '+S.correct+' av '+S.answered+' gånger.' : 'Kör igen när du vill!',
    stats:[{label:'Poäng', val:S.score, icon:I.star, c:'#FFB020'},{label:'Undvek', val:S.dodged, icon:I.rocket, c:'#8B7CFF'},{label:'Bästa svit', val:S.maxCombo, icon:I.flame, c:'#FF7A1A'}],
    gems, streakUp, goalNow: !beforeGoal && todayXp() >= ST.goal,
    again:{label:'Flyg igen', fn:() => startSpace(S.node)}
  });
}
function stopSpace(){ if (SG){ SG.running = false; SG = null; } renderHome(); }
$('#spaceQuit').onclick = () => { if (!SG) return renderHome(); if (SG.phase === 'intro') return stopSpace(); if (SG.dodged === 0 && SG.answered === 0) return stopSpace(); SG.phase = 'over'; endSpace(); };
$('#sLeft').onclick = () => steer(false);
$('#sRight').onclick = () => steer(true);
document.addEventListener('visibilitychange', () => { if (SG) SG.last = performance.now(); });


/* ================= keyboard ================= */
document.addEventListener('keydown', e => {
  if ($('#editor').open || e.metaKey || e.ctrlKey || e.altKey || document.querySelector('.sheet') || e.target.closest('input,textarea')) return;
  const k = e.key;
  if (SG){ if (k.toLowerCase() === 'f'){ e.preventDefault(); steer(false); } else if (k.toLowerCase() === 'r'){ e.preventDefault(); steer(true); } else if (k === 'Enter' && SG.phase === 'intro'){ e.preventDefault(); $('#sGo').click(); } return; }
  if (!L || !EX) return;
  if (L.locked){ if (k === 'Enter'){ const b = $('#contBtn'); if (b && document.activeElement !== b){ e.preventDefault(); b.click(); } } return; }
  if (/^[1-4]$/.test(k) && EX.pick){ EX.pick(+k-1); return; }
  if (EX.yes && (k === 'ArrowRight' || k.toLowerCase() === 'r')) return EX.yes();
  if (EX.no && (k === 'ArrowLeft' || k.toLowerCase() === 'f')) return EX.no();
  if (k === 'Enter'){ const b = $('#checkBtn'); if (b && !b.disabled && document.activeElement !== b){ e.preventDefault(); b.click(); } return; }
  if (EX.key){ if (k === 'Backspace'){ e.preventDefault(); EX.back(); } else if (k.length === 1) EX.key(TRACK.kind === 'spell' ? k.toLowerCase() : k); }
});

/* ================= word editor ================= */
const dlg = $('#editor');
function sectionsToText(secs){ return secs.map(s => '# '+s.name+(s.sub?' | '+s.sub:'')+'\n'+s.items.map(([f,sv]) => f+' = '+sv).join('\n')).join('\n\n'); }
function openEditor(){
  const lang = TRACK.kind === 'lang';
  $('#edTitle').textContent = lang ? 'Glosor i '+TRACK.name : 'Ordlistan';
  $('#edHelp').textContent = lang
    ? 'En glosa per rad: '+(TRACK.lang === 'de' ? 'tyska' : 'engelska')+' = svenska. En rad som börjar med # startar en ny del på stigen, till exempel ”# Vecka 42”. Sparas i den här webbläsaren.'
    : 'Ett ord per rad. Listan sparas i den här webbläsaren. Nya ord får automatiskt påhittade felstavningar.';
  const cur = TS().custom;
  $('#wordsInput').value = lang ? sectionsToText(cur && cur.length ? cur : TRACK.sections.map(s => ({name:s.name, sub:s.sub, items:s.items}))) : words.map(o => o.w).join('\n');
  $('#edErr').textContent = '';
  $('#edReset').hidden = lang ? !TRACK.sections.length : false;
  try{ dlg.showModal(); }catch(e){ dlg.setAttribute('open',''); }
}
$('#edCancel').onclick = () => dlg.close();
$('#edReset').onclick = () => { $('#wordsInput').value = TRACK.kind === 'lang' ? sectionsToText(TRACK.sections) : SPELL_ALL.map(b => b.w).join('\n'); };
$('#edSave').onclick = () => {
  const text = $('#wordsInput').value;
  if (TRACK.kind === 'lang'){
    const secs = []; const bad = [];
    let cur = null;
    text.split('\n').forEach(line => {
      const l = line.trim(); if (!l) return;
      if (l.startsWith('#')){ const [nm, sub] = l.slice(1).split('|').map(x => x.trim()); cur = {id:'s'+(secs.length+1), name:nm || 'Del '+(secs.length+1), sub:sub||'', items:[]}; secs.push(cur); return; }
      const m = l.match(/^(.+?)\s*[=\t]\s*(.+)$/);
      if (!m){ bad.push(l); return; }
      if (!cur){ cur = {id:'s1', name:'Glosor', sub:'', items:[]}; secs.push(cur); }
      cur.items.push([m[1].trim(), m[2].trim()]);
    });
    const good = secs.filter(s => s.items.length);
    if (bad.length){ $('#edErr').textContent = 'De här raderna saknar ”=”: '+bad.slice(0,3).join(' · ')+(bad.length>3?' …':''); return; }
    if (!good.length){ $('#edErr').textContent = 'Skriv minst en glosa, till exempel ”house = hus”.'; return; }
    const same = TRACK.sections.length && sectionsToText(good) === sectionsToText(TRACK.sections);
    TS().custom = same ? null : good;
  } else {
    const raw = text.split(/[\n,;]+/).map(s => s.replace(/^\s*\d+[.)]?\s*/, '').trim().toLowerCase()).filter(Boolean);
    const bad = raw.filter(s => !/^[a-zåäöé]{2,20}$/.test(s)), list = [...new Set(raw.filter(s => /^[a-zåäöé]{2,20}$/.test(s)))];
    if (!list.length){ $('#edErr').textContent = 'Skriv minst ett ord, ett per rad.'; return; }
    if (bad.length){ $('#edErr').textContent = 'De här gick inte att använda (bara bokstäver, inga mellanslag): '+bad.join(', '); return; }
    const isBase = list.length === SPELL_ALL.length && list.every((w,i) => w === SPELL_ALL[i].w);
    TS().custom = isBase ? null : list;
  }
  save(); loadTrack(); dlg.close(); renderHome();
};

/* ================= boot ================= */
applySkin(); loadTrack();
if (ST) renderHome(); else showWho();
initCloud();
})();
</script>
