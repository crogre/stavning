<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordrummet</title>
<meta name="description" content="Öva glosor och stavning. Varje klar ordlista ger en ny möbel till ditt rum.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ordrummet">
<meta name="theme-color" content="#F3EDE1">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="home" class="home">
  <section class="roomwrap" aria-label="Ditt rum">
    <div id="roomHost" class="roomhost"></div>
    <div id="roomFallback" class="roomfallback" hidden></div>
    <div class="roomhead">
      <div>
        <div class="brand">Ordrummet</div>
        <div class="lvl" id="lvlLine"></div>
      </div>
      <div class="headbtns">
      <button class="iconbtn" id="editBtn" aria-label="Möblera rummet" hidden></button>
      <button class="iconbtn" id="settingsBtn" aria-label="Inställningar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
      </button>
      </div>
    </div>
    <div class="revealcard" id="revealCard" hidden role="status"></div>
  </section>
  <section class="panel" id="panel"></section>
</main>

<section id="lesson" class="lesson" hidden aria-live="polite"></section>
<div id="sheet" class="sheetwrap" hidden></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script type="module" src="app.js"></script>
<noscript><p style="padding:24px">Ordrummet behöver JavaScript för att fungera.</p></noscript>
</body>
</html>
